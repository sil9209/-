<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>미니빌2 친구 대전</title><style>
:root{font-family:system-ui,sans-serif;color:#163450;background:#eef6fa}*{box-sizing:border-box}body{margin:0}header{background:linear-gradient(120deg,#163c64,#147d9c);color:#fff;padding:18px 16px}h1{font-size:22px;margin:0}main{max-width:900px;margin:auto;padding:12px}.panel{background:white;border-radius:18px;padding:16px;margin-bottom:12px;box-shadow:0 3px 14px #16345010}h2{font-size:16px;margin:0 0 12px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(132px,1fr));gap:8px}.tile{background:#f4f8fc;border:2px solid #dce9f0;border-radius:13px;padding:12px;text-align:left;min-height:132px;color:#173450}.tile b{display:block;margin:5px 0}.tile:disabled{opacity:.4}.tile .e{font-size:29px}.tile.red{background:#fff1f0}.tile.blue{background:#e9f5ff}.tile.green{background:#ecf9ed}.tile.purple{background:#f4eaff}.tile.land{background:#fff7d9}button{cursor:pointer;font:inherit}button.action{padding:12px 16px;background:#1677b5;color:white;border:0;border-radius:12px;font-weight:700;margin:4px 4px 4px 0}button.secondary{background:#6c7d90}input{padding:13px;border:1px solid #c2d4e3;border-radius:12px;width:100%;margin:5px 0 10px;font:inherit}.muted{font-size:12px;color:#718395}.player{border:1px solid #e2e9ed;border-radius:11px;padding:10px;margin:5px 0}.active{border:2px solid #f8b337;background:#fffaf0}.dice{font-size:44px;text-align:center;margin:15px}.log{max-height:140px;overflow:auto;font-size:12px;line-height:1.8}.hide{display:none}.msg{color:#cc3947}.sticky{position:sticky;top:0;z-index:2}#topline{font-size:13px;opacity:.9}</style></head><body><header><h1>🏙️ 미니빌 2 · 친구 대전</h1><div id="topline">AI 없이 실시간 2–5인</div></header><main><section id="lobby" class="panel"><h2>친구와 함께 게임하기</h2><label>닉네임<input id="name" maxlength="12" placeholder="닉네임"></label><label>참가 코드 (새 방이면 비워두기)<input id="code" maxlength="6" placeholder="예: ABC123"></label><button class="action" onclick="join()">방 만들기 / 입장하기</button><p id="error" class="msg"></p></section><div id="game" class="hide"><section class="panel sticky"><h2 id="room"></h2><button class="action" onclick="share()">🔗 친구 초대 링크 복사</button><div id="people"></div><div id="phase"></div><div id="dice" class="dice"></div><div id="controls"></div></section><section class="panel"><h2>🏪 건물 시장</h2><div id="cards" class="grid"></div></section><section class="panel"><h2>⭐ 랜드마크 (3개 완성 시 승리)</h2><div id="landmarks" class="grid"></div></section><section class="panel"><h2>🏘️ 내 도시</h2><div id="mine"></div></section><section class="panel"><h2>📜 진행 기록</h2><div id="log" class="log"></div><p class="muted">비공식 모바일 팬게임. 일부 원작 카드 효과는 간소화되어 있습니다. 서버가 재시작되면 방 정보가 초기화됩니다.</p></section></div></main><script>
const $=id=>document.getElementById(id);let ws,S,me=localStorage.getItem('mini2pid')||'',code=new URLSearchParams(location.search).get('room')||'';$('code').value=code;$('name').value=localStorage.getItem('mini2name')||'';let pending=false;function send(o){if(ws?.readyState===1)ws.send(JSON.stringify(o))}
function join(){let name=$('name').value.trim()||'친구';localStorage.setItem('mini2name',name);let c=$('code').value.trim().toUpperCase();if(!c)me='';ws=new WebSocket((location.protocol==='https:'?'wss':'ws')+'://'+location.host);ws.onopen=()=>send({type:'join',name,code:c,pid:me});ws.onmessage=e=>{let m=JSON.parse(e.data);if(m.type==='error'){$('error').textContent=m.message;return}if(m.type==='joined'){me=m.pid;code=m.code;localStorage.setItem('mini2pid',me);history.replaceState(null,'','?room='+code);$('lobby').classList.add('hide');$('game').classList.remove('hide')}if(m.type==='state'){S=m.state;render()}};ws.onclose=()=>{$('error').textContent='연결이 끊어졌습니다. 새로고침 후 재입장하세요.'}}
function share(){let url=location.origin+'/?room='+code;navigator.clipboard?.writeText(url).then(()=>alert('초대 링크 복사 완료!')).catch(()=>prompt('친구에게 링크 공유',url))}
function act(type,opts={}){send({type,...opts})}const dice=['⚀','⚁','⚂','⚃','⚄','⚅'];
function render(){if(!S)return;let p=S.players[S.turn],mine=S.players.find(x=>x.id===me),myturn=S.started&&p.id===me&&!S.winner;$('room').textContent='방 코드: '+S.code;$('people').innerHTML=S.players.map(x=>'<div class="player '+(p?.id===x.id?'active':'')+'">👤 '+esc(x.name)+(x.id===S.host?' 👑':'')+(x.connected?' 🟢':' ⚪')+'　🪙'+(S.started?x.coins:'—')+'　🏛️'+(x.landmarks?.length||0)+'/3</div>').join('');$('phase').innerHTML=S.winner?'🏆 <b>'+esc(S.winner)+' 승리!</b>':!S.started?'친구 2명 이상 입장하면 방장이 시작할 수 있습니다':(myturn?'✅ 내 차례':'⏳ '+esc(p.name)+' 차례')+' · '+(S.phase==='setup'?'사전 건설 '+S.round+'/3':S.phase==='roll'?'주사위 굴리기':'건물 구매');$('dice').textContent=S.dice?.length?S.dice.map(n=>dice[n-1]).join(' '):'🎲';let controls='';if(!S.started&&S.host===me)controls='<button class="action" onclick="act(\'start\')">게임 시작</button>';if(myturn&&S.phase==='roll')controls='<button class="action" onclick="act(\'roll\',{count:1})">🎲 1개</button><button class="action" onclick="act(\'roll\',{count:2})">🎲🎲 2개</button>';if(myturn&&['setup','buy'].includes(S.phase))controls='<button class="action secondary" onclick="act(\'pass\')">구매 없이 넘기기</button>';$('controls').innerHTML=controls;
function tiles(cs,l){return cs.filter(c=>c.stock>0).map(c=>{let cost=c.cost+(l?(mine?.landmarks?.length||0)*3:0),ok=myturn&&['setup','buy'].includes(S.phase)&&(!l||S.phase==='buy')&&mine.coins>=cost&&(!l||!mine.landmarks.includes(c.id))&&(!(!l&&c.color==='purple'&&mine.cards.includes(c.id)));return '<button '+(ok?'':'disabled')+' class="tile '+(l?'land':c.color)+'" onclick="act(\'buy\',{kind:\''+(l?'landmark':'card')+'\',id:'+c.id+'})"><span class="e">'+c.icon+'</span><b>'+esc(c.name)+'</b><small>'+(l?'랜드마크':('🎲 '+c.num+' · '+c.color))+'</small><p>🪙 '+cost+(l?'':' · 수입 '+c.pay)+'</p><small>재고 '+c.stock+'</small></button>'}).join('')}
$('cards').innerHTML=S.started?tiles(S.market.cards,false):'시작 후 카드가 표시됩니다';$('landmarks').innerHTML=S.started?tiles(S.market.landmarks,true):'';$('mine').textContent=mine?(mine.cards.map(i=>S.market.cards.find(c=>c.id===i)?.icon+' '+S.market.cards.find(c=>c.id===i)?.name).join(' · ')||'건물 없음')+' | ⭐ '+mine.landmarks.map(i=>S.market.landmarks.find(c=>c.id===i)?.name).join(', '):'';$('log').innerHTML=(S.logs||[]).slice().reverse().map(x=>'<div>'+esc(x)+'</div>').join('')}
function esc(x){return String(x||'').replace(/[&<>"]/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch]))}
if(code&&$('name').value)join();
</script></body></html>
