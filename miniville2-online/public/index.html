<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>미니빌2 친구 대전</title><style>
:root{font-family:system-ui,sans-serif;color:#163450;background:#eef6fa}*{box-sizing:border-box}body{margin:0}header{background:linear-gradient(120deg,#163c64,#147d9c);color:#fff;padding:18px 16px}h1{font-size:22px;margin:0}main{max-width:900px;margin:auto;padding:12px}.panel{background:white;border-radius:18px;padding:16px;margin-bottom:12px;box-shadow:0 3px 14px #16345010}h2{font-size:16px;margin:0 0 12px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(132px,1fr));gap:8px}.tile{background:#f4f8fc;border:2px solid #dce9f0;border-radius:13px;padding:12px;text-align:left;min-height:132px;color:#173450}.tile b{display:block;margin:5px 0}.tile:disabled{opacity:.4}.tile .e{font-size:29px}.tile.red{background:#fff1f0}.tile.blue{background:#e9f5ff}.tile.green{background:#ecf9ed}.tile.purple{background:#f4eaff}.tile.land{background:#fff7d9}button{cursor:pointer;font:inherit}button.action{padding:12px 16px;background:#1677b5;color:white;border:0;border-radius:12px;font-weight:700;margin:4px 4px 4px 0}button.secondary{background:#6c7d90}input{padding:13px;border:1px solid #c2d4e3;border-radius:12px;width:100%;margin:5px 0 10px;font:inherit}.muted{font-size:12px;color:#718395}.player{border:1px solid #e2e9ed;border-radius:11px;padding:10px;margin:5px 0}.active{border:2px solid #f8b337;background:#fffaf0}.dice{font-size:44px;text-align:center;margin:15px}.log{max-height:140px;overflow:auto;font-size:12px;line-height:1.8}.hide{display:none}.msg{color:#cc3947}.sticky{position:sticky;top:0;z-index:2}#topline{font-size:13px;opacity:.9}
.landing{max-width:440px;margin:26px auto;padding:22px 20px 28px;text-align:center}.brand{border-radius:20px;background:linear-gradient(160deg,#8edcfb 0%,#e6faff 52%,#cde8a9 100%);border:3px solid #fff;padding:35px 8px 24px;margin-bottom:25px;box-shadow:0 8px 25px #3385a327}.brandlogo{font-size:clamp(42px,11vw,62px);font-weight:1000;letter-spacing:-3px;color:#fff;-webkit-text-stroke:2px #195e8e;text-shadow:0 5px 0 #1477a9,2px 8px 0 #164d70}.brandlogo span{color:#ffdf48;-webkit-text-stroke:2px #e57c19;text-shadow:0 5px 0 #eb861b}.brand p{font-size:14px;color:#326a82;font-weight:800}.skyline{font-size:27px;letter-spacing:3px}.diceart{font-size:32px;margin-top:12px}.landing .large{display:block;width:100%;margin:9px 0;padding:16px}.landing label{text-align:left;display:block;font-weight:700;font-size:13px}.landing h2{margin-bottom:14px}body:has(.landing:not(.hide)) header{display:none}body:has(.landing:not(.hide)){background:linear-gradient(180deg,#d5f4ff,#f5fcff 62%,#d8f1df);min-height:100vh} 
.landing{margin:8px auto 22px;padding:12px 16px 24px;border-radius:25px;background:#ffffffdd}
.landing .brand{position:relative;min-height:390px;margin:-3px -5px 20px;padding:62px 10px 26px;background:radial-gradient(circle at 68% 14%,#fff6a5 0 35px,transparent 37px),linear-gradient(180deg,#78d8ff 0%,#b9edff 53%,#8bdc9b 53%,#b7edaa 100%);border:4px solid #fff;border-radius:23px;overflow:hidden;box-shadow:0 8px 24px #1772a72a}
.landing .brand:before{content:'🏙️   🏘️   🏢';position:absolute;bottom:65px;left:0;width:100%;font-size:58px;letter-spacing:5px;text-shadow:2px 4px #2a8291}
.landing .brand:after{content:'🌳   🏠   🚕   🏪   🌳';position:absolute;bottom:2px;left:0;width:100%;font-size:30px}
.brandlogo{position:relative;z-index:1;font-size:clamp(52px,13vw,77px);transform:rotate(-3deg);margin-top:16px;text-shadow:0 6px #1477a9,0 10px #145070}
.skyline{font-size:34px}.brand p{position:relative;z-index:1;background:#ffffffb8;width:max-content;max-width:100%;margin:14px auto 0;padding:8px 12px;border-radius:18px}.diceart{position:absolute;bottom:111px;left:0;width:100%;z-index:1}.playtitle{margin-top:12px}.landing .large{font-size:17px;padding:17px;border-radius:15px}.landing .large.secondary{background:#236f7e}
.roomlisttitle{display:flex;justify-content:space-between;align-items:center;margin:15px 0 8px;font-weight:800}.tiny{border:0;background:#e2f3fa;border-radius:7px;padding:5px 9px}.roomentry{width:100%;background:#f0f9ff;border:1px solid #b9dff2;border-radius:12px;padding:14px;margin-bottom:7px;display:flex;justify-content:space-between;gap:6px;align-items:center;text-align:left;color:#164b6e}.roomentry span{font-size:12px;white-space:nowrap}
</style></head><body><header><h1>🏙️ 미니빌 2 · 친구 대전</h1><div id="topline">AI 없이 실시간 2–5인</div></header><main><section id="lobby" class="panel landing"><div class="brand"><div class="skyline">🏠 🏢 🏬 🎡</div><div class="brandlogo">미니빌 <span>2</span></div><p>친구들과 만드는 우리만의 도시</p><div class="diceart">🎲 🪙 🎲</div></div><h2 class="playtitle">친구들과 도시 건설 대결</h2><label>닉네임<input id="name" maxlength="12" placeholder="닉네임"></label><div id="joinbox" class="hide"><label>방 코드<input id="code" maxlength="6" placeholder="예: ABC123"></label></div><button class="action large" onclick="createRoom()">🏙️ 방 만들기</button><button class="action secondary large" onclick="showRooms()">🚪 만들어진 방 들어가기</button><div id="roomlist" class="hide"><div class="roomlisttitle">입장 가능한 방 <button onclick="refreshRooms()" class="tiny">↻ 새로고침</button></div><div id="roomitems"></div><div class="muted">방이 보이지 않으면 방 코드를 입력하세요.</div></div><div id="joinbtn" class="hide"><button class="action large" onclick="join()">참가하기</button></div><p id="error" class="msg"></p></section><div id="game" class="hide"><section class="panel sticky"><h2 id="room"></h2><button class="action" onclick="share()">🔗 방 링크 복사</button><button class="action secondary" onclick="leaveRoom()">🚪 방 나가기</button><div id="people"></div><div id="phase"></div><div id="dice" class="dice"></div><div id="controls"></div></section><section class="panel"><h2>🏪 건물 시장</h2><div id="cards" class="grid"></div></section><section class="panel"><h2>⭐ 랜드마크 (3개 완성 시 승리)</h2><div id="landmarks" class="grid"></div></section><section class="panel"><h2>🏘️ 내 도시</h2><div id="mine"></div></section><section class="panel"><h2>📜 진행 기록</h2><div id="log" class="log"></div><p class="muted">비공식 모바일 팬게임. 일부 원작 카드 효과는 간소화되어 있습니다. 서버가 재시작되면 방 정보가 초기화됩니다.</p></section></div></main><script>
const $=id=>document.getElementById(id);let ws,S,me=localStorage.getItem('mini2pid')||'',code=new URLSearchParams(location.search).get('room')||'';$('code').value=code;$('name').value=localStorage.getItem('mini2name')||'';let pending=false;function send(o){if(ws?.readyState===1)ws.send(JSON.stringify(o))}
function leaveRoom(){if(!confirm('방에서 나가시겠습니까? 진행 중인 게임에서는 복귀할 수 없습니다.'))return;send({type:'leave'});localStorage.removeItem('mini2pid');me='';code='';S=null;history.replaceState(null,'',location.pathname);$('game').classList.add('hide');$('lobby').classList.remove('hide');$('joinbox').classList.add('hide');$('joinbtn').classList.add('hide');$('roomlist').classList.add('hide');$('code').value='';$('error').textContent='';ws?.close();ws=null}
function showRooms(){ $('roomlist').classList.remove('hide');refreshRooms() }
async function refreshRooms(){let el=$('roomitems');el.textContent='방 목록 조회 중...';try{let res=await fetch('/api/rooms',{cache:'no-store'});if(!res.ok)throw Error();let list=await res.json();el.innerHTML=list.length?list.map(r=>'<button class="roomentry" onclick="enterRoom(\''+r.code+'\')"><b>🏡 '+esc(r.host)+'님의 방</b><span>👥 '+r.count+'/5명 · '+r.code+' →</span></button>').join(''):'<p class="muted">현재 열린 방이 없습니다. 새 방을 만들어 주세요.</p>'}catch{el.textContent='방 목록을 불러오지 못했습니다.'}}
function enterRoom(c){$('code').value=c;join()}
function createRoom(){ $('code').value='';join() }function showJoin(){ $('joinbox').classList.remove('hide');$('joinbtn').classList.remove('hide');$('code').focus() }function join(){let name=$('name').value.trim()||'친구';localStorage.setItem('mini2name',name);let c=$('code').value.trim().toUpperCase();if(!c)me='';ws=new WebSocket((location.protocol==='https:'?'wss':'ws')+'://'+location.host);ws.onopen=()=>send({type:'join',name,code:c,pid:me});ws.onmessage=e=>{let m=JSON.parse(e.data);if(m.type==='error'){$('error').textContent=m.message;return}if(m.type==='left'){return}if(m.type==='joined'){me=m.pid;code=m.code;localStorage.setItem('mini2pid',me);history.replaceState(null,'','?room='+code);$('lobby').classList.add('hide');$('game').classList.remove('hide')}if(m.type==='state'){S=m.state;render()}};ws.onclose=()=>{if($('game').classList.contains('hide'))return;$('error').textContent='연결이 끊어졌습니다. 새로고침 후 재입장하세요.'}}
function share(){let url=location.origin+'/?room='+code;navigator.clipboard?.writeText(url).then(()=>alert('초대 링크 복사 완료!')).catch(()=>prompt('친구에게 링크 공유',url))}
function act(type,opts={}){send({type,...opts})}const dice=['⚀','⚁','⚂','⚃','⚄','⚅'];
function render(){if(!S)return;let p=S.players[S.turn],mine=S.players.find(x=>x.id===me),myturn=S.started&&p.id===me&&!S.winner;$('room').textContent='방 코드: '+S.code;$('people').innerHTML=S.players.map(x=>'<div class="player '+(p?.id===x.id?'active':'')+'">👤 '+esc(x.name)+(x.id===S.host?' 👑':'')+(x.connected?' 🟢':' ⚪')+'　🪙'+(S.started?x.coins:'—')+'　🏛️'+(x.landmarks?.length||0)+'/3</div>').join('');$('phase').innerHTML=S.winner?'🏆 <b>'+esc(S.winner)+' 승리!</b>':!S.started?'친구 2명 이상 입장하면 방장이 시작할 수 있습니다':(myturn?'✅ 내 차례':'⏳ '+esc(p.name)+' 차례')+' · '+(S.phase==='setup'?'사전 건설 '+S.round+'/3':S.phase==='roll'?'주사위 굴리기':'건물 구매');$('dice').textContent=S.dice?.length?S.dice.map(n=>dice[n-1]).join(' '):'🎲';let controls='';if(!S.started&&S.host===me)controls='<button class="action" onclick="act(\'start\')">게임 시작</button>';if(myturn&&S.phase==='roll')controls='<button class="action" onclick="act(\'roll\',{count:1})">🎲 1개</button><button class="action" onclick="act(\'roll\',{count:2})">🎲🎲 2개</button>';if(myturn&&['setup','buy'].includes(S.phase))controls='<button class="action secondary" onclick="act(\'pass\')">구매 없이 넘기기</button>';$('controls').innerHTML=controls;
function tiles(cs,l){return cs.filter(c=>c.stock>0).map(c=>{let cost=c.cost+(l?(mine?.landmarks?.length||0)*3:0),ok=myturn&&['setup','buy'].includes(S.phase)&&(!l||S.phase==='buy')&&mine.coins>=cost&&(!l||!mine.landmarks.includes(c.id))&&(!(!l&&c.color==='purple'&&mine.cards.includes(c.id)));return '<button '+(ok?'':'disabled')+' class="tile '+(l?'land':c.color)+'" onclick="act(\'buy\',{kind:\''+(l?'landmark':'card')+'\',id:'+c.id+'})"><span class="e">'+c.icon+'</span><b>'+esc(c.name)+'</b><small>'+(l?'랜드마크':('🎲 '+c.num+' · '+c.color))+'</small><p>🪙 '+cost+(l?'':' · 수입 '+c.pay)+'</p><small>재고 '+c.stock+'</small></button>'}).join('')}
$('cards').innerHTML=S.started?tiles(S.market.cards,false):'시작 후 카드가 표시됩니다';$('landmarks').innerHTML=S.started?tiles(S.market.landmarks,true):'';$('mine').textContent=mine?(mine.cards.map(i=>S.market.cards.find(c=>c.id===i)?.icon+' '+S.market.cards.find(c=>c.id===i)?.name).join(' · ')||'건물 없음')+' | ⭐ '+mine.landmarks.map(i=>S.market.landmarks.find(c=>c.id===i)?.name).join(', '):'';$('log').innerHTML=(S.logs||[]).slice().reverse().map(x=>'<div>'+esc(x)+'</div>').join('')}
function esc(x){return String(x||'').replace(/[&<>"]/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch]))}
if(code){showJoin();if($('name').value)join();}
</script></body></html>
